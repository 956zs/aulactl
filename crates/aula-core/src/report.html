<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>aulactl 回放報告</title>
<style>
:root {
  --bg: #121316; --card: #1b1d22; --line: #2b2e36; --text: #e4e6eb; --dim: #9aa0ab;
  --accent: #7cc4ff; --ok: #7ddc9a; --warn: #f0c36a; --bad: #ff7b7b;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text);
  font: 14px/1.5 "Noto Sans TC", "Noto Sans CJK TC", system-ui, sans-serif; }
main { max-width: 1400px; margin: 0 auto; padding: 20px; }
h1 { font-size: 20px; margin: 0 0 4px; word-break: break-word; }
h2 { font-size: 15px; margin: 0 0 10px; color: var(--accent); }
.sub { color: var(--dim); font-size: 13px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; margin-top: 14px; }
.kpis { display: flex; flex-wrap: wrap; gap: 10px 28px; }
.kpi .v { font-size: 20px; font-variant-numeric: tabular-nums; }
.kpi .l { color: var(--dim); font-size: 12px; }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
th, td { padding: 6px 8px; border-bottom: 1px solid var(--line); text-align: right; white-space: nowrap; }
th { color: var(--dim); font-weight: normal; font-size: 12px; }
th:first-child, td:first-child, td.l, th.l { text-align: left; }
.scroll { overflow-x: auto; }
.bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 8px; }
button { background: #262a33; color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 4px 10px; cursor: pointer; font: inherit; }
button:hover { border-color: var(--accent); }
#tl { width: 100%; display: block; border-radius: 6px; background: #0e0f12; cursor: grab; touch-action: none; }
#tl.drag { cursor: grabbing; }
#readout { color: var(--dim); font-variant-numeric: tabular-nums; min-height: 1.5em; }
.legend span { display: inline-flex; align-items: center; gap: 5px; margin-right: 14px; color: var(--dim); font-size: 12px; }
.sw { width: 14px; height: 10px; border-radius: 2px; display: inline-block; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-size: 12px; padding: 2px 8px; }
.good { color: var(--ok); } .mid { color: var(--warn); } .low { color: var(--bad); }
footer { color: var(--dim); font-size: 12px; margin: 18px 0 6px; }
</style>
</head>
<body>
<main>
  <h1 id="title"></h1>
  <div class="sub" id="meta"></div>
  <div class="sub" id="files"></div>

  <section class="card">
    <h2>對齊品質</h2>
    <div class="kpis" id="align"></div>
  </section>

  <section class="card">
    <h2>按鍵統計</h2>
    <div class="scroll"><table id="stats"></table></div>
    <div class="sub" style="margin-top:8px">
      判定時深度＝回放記錄按下的瞬間鍵盤的行程；峰值＝每次按下期間最深處；觸底＝峰值 ≥ 最大行程 − 0.1 mm；
      RT 連按＝上次放開後未回到觸發點之上就再次按下；淺按＝峰值 &lt; 觸發點 + 0.5 mm。
    </div>
  </section>

  <section class="card">
    <h2>時間軸</h2>
    <div class="bar">
      <button id="fit">全部</button>
      <button id="zin">放大</button>
      <button id="zout">縮小</button>
      <span class="sub">滾輪縮放、拖曳平移；時間為譜面時間</span>
    </div>
    <div class="legend">
      <span><i class="sw" style="background:#7cc4ff"></i>按鍵行程</span>
      <span><i class="sw" style="background:rgba(125,220,154,.28)"></i>回放按下（已對上）</span>
      <span><i class="sw" style="background:rgba(255,123,123,.30)"></i>回放按下（未對上）</span>
      <span><i class="sw" style="background:#f0c36a"></i>觸發點</span>
    </div>
    <canvas id="tl"></canvas>
    <div id="readout"></div>
  </section>

  <section class="card" id="shallowCard">
    <h2>淺按列表（點選跳到時間軸）</h2>
    <div id="shallow"></div>
  </section>

  <footer id="foot"></footer>
</main>
<script type="application/json" id="data">/*DATA*/</script>
<script>
"use strict";
const R = JSON.parse(document.getElementById("data").textContent);
const $ = (id) => document.getElementById(id);
const el = (tag, text, cls) => { const e = document.createElement(tag); if (text !== undefined) e.textContent = text; if (cls) e.className = cls; return e; };
const f = (v, d = 2) => (v === null || v === undefined || !isFinite(v)) ? "–" : Number(v).toFixed(d);
const MODS = [[1,"NF"],[2,"EZ"],[4,"TD"],[8,"HD"],[16,"HR"],[32,"SD"],[64,"DT"],[128,"RX"],[256,"HT"],[512,"NC"],[1024,"FL"],[4096,"SO"],[8192,"AP"],[16384,"PF"]];
function mods(m) {
  const out = MODS.filter(([b]) => m & b).map(([, n]) => n).filter((n) => !(n === "DT" && (m & 512)) && !(n === "SD" && (m & 16384)));
  return out.length ? out.join("") : "NM";
}
const when = (ms) => ms ? new Date(ms).toLocaleString("zh-TW", { hour12: false }) : "–";
const songTime = (ms) => { const s = Math.max(0, ms) / 1000; return `${Math.floor(s / 60)}:${(s % 60).toFixed(3).padStart(6, "0")}`; };

document.title = `${R.title} – aulactl 回放報告`;
$("title").textContent = R.title;
const c = R.counts;
$("meta").textContent = `${R.player} · ${R.mode} · ${mods(R.mods)}${R.rate !== 1 ? ` (×${R.rate})` : ""} · 分數 ${R.score.toLocaleString()} · 最大連擊 ${R.max_combo} · 300/100/50/miss ${c[0]}/${c[1]}/${c[2]}/${c[5]} · 成績時間 ${when(R.replay_unix_ms)}`;
$("files").textContent = `記錄：${R.session_file}　回放：${R.replay_file}`;
$("foot").textContent = `aulactl · 產生於 ${when(R.generated_unix_ms)} · 最大行程 ${f(R.max_mm)} mm`;

const A = R.align;
const rateCls = A.match_rate >= 0.9 ? "good" : A.match_rate >= 0.75 ? "mid" : "low";
for (const [label, value, cls] of [
  ["對上比例", `${(A.match_rate * 100).toFixed(1)} %`, rateCls],
  ["對上的按壓", `${A.matched} / ${A.replay_downs}`],
  ["誤差中位數", `${f(A.residual_median)} ms`],
  ["誤差 p95", `${f(A.residual_p95)} ms`],
  ["回放未對上", `${A.unmatched_replay}`],
  ["鍵盤多出的按壓", `${A.unmatched_session}`],
  ["時間位移", `${(A.offset_ms / 1000).toFixed(3)} s`],
]) {
  const k = el("div", undefined, "kpi");
  k.append(el("div", value, "v " + (cls || "")), el("div", label, "l"));
  $("align").append(k);
}

const head = ["按鍵", "回放輸入", "觸發設定", "按壓", "判定時深度 p10 / 中位 / p90 (mm)", "峰值中位 (mm)", "峰值 p10", "觸底比例", "按住時間中位 (ms)", "按住 p10 – p90", "RT 連按", "淺按"];
const tr = el("tr");
head.forEach((h, i) => tr.append(el("th", h, i < 3 ? "l" : "")));
$("stats").append(tr);
for (const k of R.keys) {
  const s = k.stats;
  const trig = k.mode === "fixed" ? `固定 ${f(k.point)}` : `${k.mode === "rt" ? "RT" : "RT 分離"} ${f(k.point)} / ${f(k.press)}${k.mode === "rt" ? "" : " / " + f(k.release)}`;
  const row = el("tr");
  [
    [`${k.label} (${k.code})`, "l"], [k.input, "l"], [trig + " mm", "l"],
    [`${s.presses}`], [`${f(s.at_down_p10)} / ${f(s.at_down_median)} / ${f(s.at_down_p90)}`],
    [f(s.peak_median)], [f(s.peak_p10)], [s.bottom_out_ratio === null ? "–" : `${(s.bottom_out_ratio * 100).toFixed(1)} %`],
    [f(s.hold_median, 1)], [`${f(s.hold_p10, 1)} – ${f(s.hold_p90, 1)}`], [`${s.rt_repress}`], [`${s.shallow}`],
  ].forEach(([t, cls]) => row.append(el("td", t, cls)));
  $("stats").append(row);
}

// ---- timeline ----
const cv = $("tl"), ctx = cv.getContext("2d");
const LANE = 130, AXIS = 26, PADL = 74;
let view = [R.view[0], R.view[1]];
const full = [R.view[0], R.view[1]];
function size() {
  const dpr = window.devicePixelRatio || 1;
  const w = cv.clientWidth, h = AXIS + LANE * Math.max(1, R.keys.length);
  cv.style.height = h + "px";
  cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  draw();
}
const W = () => cv.clientWidth;
const xOf = (t) => PADL + (t - view[0]) / (view[1] - view[0]) * (W() - PADL - 8);
const tOf = (x) => view[0] + (x - PADL) / (W() - PADL - 8) * (view[1] - view[0]);
function lower(arr, v) { let lo = 0, hi = arr.length; while (lo < hi) { const m = (lo + hi) >> 1; if (arr[m] < v) lo = m + 1; else hi = m; } return lo; }
function niceStep(span) {
  const raw = span / 8, p = Math.pow(10, Math.floor(Math.log10(raw)));
  for (const m of [1, 2, 5, 10]) if (raw <= m * p) return m * p;
  return 10 * p;
}
function draw() {
  const w = W(), h = cv.clientHeight;
  ctx.clearRect(0, 0, w, h);
  ctx.font = "11px system-ui, sans-serif";
  // time axis
  const step = niceStep(view[1] - view[0]);
  ctx.fillStyle = "#9aa0ab"; ctx.strokeStyle = "#23262d"; ctx.lineWidth = 1;
  for (let t = Math.ceil(view[0] / step) * step; t <= view[1]; t += step) {
    const x = Math.round(xOf(t)) + 0.5;
    ctx.beginPath(); ctx.moveTo(x, AXIS - 6); ctx.lineTo(x, h); ctx.stroke();
    ctx.fillText(step >= 1000 ? songTime(t).replace(/\.\d+$/, "") : songTime(t), x + 3, 14);
  }
  R.keys.forEach((k, i) => {
    const top = AXIS + i * LANE, y0 = top + 10, y1 = top + LANE - 12;
    const yOf = (mm) => y0 + Math.min(1, Math.max(0, mm / R.max_mm)) * (y1 - y0);
    ctx.fillStyle = "#16181c"; ctx.fillRect(PADL, top + 2, w - PADL - 8, LANE - 4);
    // replay key-down spans
    for (const [d, u, ok] of k.spans) {
      if (u < view[0] || d > view[1]) continue;
      const x = xOf(d), x2 = Math.max(x + 1, xOf(u));
      ctx.fillStyle = ok ? "rgba(125,220,154,.28)" : "rgba(255,123,123,.30)";
      ctx.fillRect(x, y0, x2 - x, y1 - y0);
    }
    // actuation point and bottom
    ctx.strokeStyle = "#f0c36a"; ctx.setLineDash([5, 4]);
    ctx.beginPath(); ctx.moveTo(PADL, yOf(k.point) + 0.5); ctx.lineTo(w - 8, yOf(k.point) + 0.5); ctx.stroke();
    ctx.setLineDash([]);
    ctx.strokeStyle = "#2f333c";
    ctx.beginPath(); ctx.moveTo(PADL, y1 + 0.5); ctx.lineTo(w - 8, y1 + 0.5); ctx.stroke();
    // depth curve (step: the stream reports movement only), min/max per pixel when dense
    const a = Math.max(0, lower(k.t, view[0]) - 1), b = Math.min(k.t.length, lower(k.t, view[1]) + 1);
    ctx.strokeStyle = "#7cc4ff"; ctx.lineWidth = 1.4; ctx.beginPath();
    const dense = (b - a) > (w - PADL) * 2;
    if (dense) {
      let px = -1, lo = 0, hi = 0, last = 0, started = false;
      for (let j = a; j < b; j++) {
        const x = Math.round(xOf(k.t[j])), y = yOf(k.mm[j]);
        if (x !== px) {
          if (px >= 0) { if (!started) { ctx.moveTo(px, last); started = true; } ctx.lineTo(px, lo); ctx.lineTo(px, hi); ctx.lineTo(px, last); }
          px = x; lo = hi = y;
        } else { lo = Math.min(lo, y); hi = Math.max(hi, y); }
        last = y;
      }
      if (px >= 0) { ctx.lineTo(px, lo); ctx.lineTo(px, hi); }
    } else {
      for (let j = a; j < b; j++) {
        const x = xOf(k.t[j]), y = yOf(k.mm[j]);
        if (j === a) ctx.moveTo(x, y); else { ctx.lineTo(x, yOf(k.mm[j - 1])); ctx.lineTo(x, y); }
      }
      if (b > a) ctx.lineTo(w - 8, yOf(k.mm[b - 1]));
    }
    ctx.stroke(); ctx.lineWidth = 1;
    // lane labels
    ctx.fillStyle = "#e4e6eb"; ctx.font = "bold 13px system-ui, sans-serif";
    ctx.fillText(k.label, 8, top + LANE / 2 - 2);
    ctx.font = "11px system-ui, sans-serif"; ctx.fillStyle = "#9aa0ab";
    ctx.fillText(k.input, 8, top + LANE / 2 + 14);
    ctx.textAlign = "right"; ctx.fillText("0", PADL - 6, y0 + 4); ctx.fillText(`${f(R.max_mm, 1)} mm`, PADL - 6, y1); ctx.textAlign = "left";
  });
}
function zoom(factor, at) {
  const t = at === undefined ? (view[0] + view[1]) / 2 : at;
  let span = (view[1] - view[0]) * factor;
  span = Math.max(20, Math.min(full[1] - full[0], span));
  const r = (t - view[0]) / (view[1] - view[0]);
  view = [t - r * span, t - r * span + span];
  clamp(); draw();
}
function clamp() {
  const span = view[1] - view[0];
  if (view[0] < full[0]) view = [full[0], full[0] + span];
  if (view[1] > full[1]) view = [full[1] - span, full[1]];
}
function jump(t) {
  const span = 600 * R.rate;
  view = [t - span / 2, t + span / 2]; clamp(); draw();
  cv.scrollIntoView({ behavior: "smooth", block: "center" });
}
cv.addEventListener("wheel", (e) => { e.preventDefault(); zoom(e.deltaY > 0 ? 1.25 : 0.8, tOf(e.offsetX)); }, { passive: false });
let drag = null;
cv.addEventListener("pointerdown", (e) => { drag = { x: e.clientX, v: view.slice() }; cv.classList.add("drag"); cv.setPointerCapture(e.pointerId); });
cv.addEventListener("pointerup", () => { drag = null; cv.classList.remove("drag"); });
cv.addEventListener("pointermove", (e) => {
  if (drag) {
    const dt = (e.clientX - drag.x) / (W() - PADL - 8) * (drag.v[1] - drag.v[0]);
    view = [drag.v[0] - dt, drag.v[1] - dt]; clamp(); draw();
  }
  const t = tOf(e.offsetX), lane = Math.floor((e.offsetY - AXIS) / LANE), k = R.keys[lane];
  if (!k || e.offsetX < PADL) { $("readout").textContent = ""; return; }
  const j = Math.max(0, lower(k.t, t + 1e-9) - 1);
  const held = k.spans.some(([d, u]) => d <= t && t <= u);
  $("readout").textContent = `${k.label}　${songTime(t)}　行程 ${k.t.length ? f(k.mm[j]) : "–"} mm　${held ? "回放：按下" : ""}`;
});
$("fit").onclick = () => { view = full.slice(); draw(); };
$("zin").onclick = () => zoom(0.5);
$("zout").onclick = () => zoom(2);
window.addEventListener("resize", size);

// ---- shallow presses ----
let anyShallow = false;
for (const k of R.keys) {
  if (!k.shallow.length) continue;
  anyShallow = true;
  const box = el("div"); box.style.marginBottom = "10px";
  box.append(el("div", `${k.label}（${k.stats.shallow} 次${k.stats.shallow > k.shallow.length ? `，列出前 ${k.shallow.length} 次` : ""}）`, "sub"));
  const chips = el("div", undefined, "chips");
  for (const s of k.shallow) {
    const b = el("button", `${songTime(s.t)} · ${f(s.peak)} mm`, "chip");
    b.onclick = () => jump(s.t);
    chips.append(b);
  }
  box.append(chips);
  $("shallow").append(box);
}
if (!anyShallow) $("shallow").append(el("div", "沒有淺按。", "sub"));
size();
</script>
</body>
</html>

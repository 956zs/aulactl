[workspace]
resolver = "2"
members = ["crates/aula-core", "crates/aulactl", "crates/aula-gui"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
aula-core = { path = "crates/aula-core" }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
flate2 = "1"
lzma-rs = "0.3"
tiny-skia = { version = "0.12", default-features = false, features = ["std", "simd"] }
fontdue = "0.9"
cxx = "1.0"
cxx-qt = "0.10"
cxx-qt-build = "0.10"
cxx-qt-lib = "0.10"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
